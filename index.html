
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cotação do Dólar</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>💵 Cotação do Dólar</h1>

        <div class="card">
            <h2>Valor do Dólar</h2>
            <p id="valor">Carregando...</p>
        </div>

        <div class="card">
            <h2>Maior Valor do Dia</h2>
            <p id="maior">Carregando...</p>
        </div>

        <div class="card">
            <h2>Menor Valor do Dia</h2>
            <p id="menor">Carregando...</p>
        </div>

        <p id="atualizacao">
            Atualizando automaticamente...
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
